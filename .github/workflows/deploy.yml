name: Deploy repository

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build plugins and repository index
        run: bun run pages

      - name: Verify output
        run: |
          ls -la build/pages
          test -f build/pages/index.json || { echo "index.json missing"; exit 1; }
          cat build/pages/index.json

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Check live index
        run: |
          sleep 20
          echo "Deployed to: ${{ steps.deployment.outputs.page_url }}"
          curl -sS -o /dev/null -w "index.json -> HTTP %{http_code}\n" "${{ steps.deployment.outputs.page_url }}index.json"
